<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>404 - Sayfa Bulunamadı | A&A Güvenlik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0b1a33; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
    .error-code { font-size: 8rem; font-weight: 800; background: linear-gradient(135deg, #1a56db, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.6); margin-bottom: 32px; max-width: 400px; margin-left: auto; margin-right: auto; line-height: 1.6; }
    .btn { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #1a56db, #f97316); color: #fff; padding: 14px 32px; border-radius: 60px; text-decoration: none; font-weight: 600; transition: all 0.3s ease; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26,86,219,0.3); }
    .icon-404 { font-size: 3rem; color: rgba(255,255,255,0.1); margin-bottom: 24px; }
  </style>
</head>
<body>
  <div>
    <div class="icon-404"><i class="fas fa-shield-halved"></i></div>
    <div class="error-code">404</div>
    <h1>Sayfa Bulunamadı</h1>
    <p>Aradığınız sayfa kaldırılmış, adı değiştirilmiş veya geçici olarak kullanılamıyor olabilir.</p>
    <a href="index.html" class="btn"><i class="fas fa-home"></i> Ana Sayfaya Dön</a>
  </div>
</body>
</html>
